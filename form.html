<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <table>
          <tr>
            <td><label for="fname" class="fname">FullName</label></td>
            <td>
              <input type="text" id="fname" name="fname" maxlength="20" />(max
              20 char a-z and A-Z)
            </td>
          </tr>
          <tr>
            <td><label for="lname" class="lname">lastname</label></td>
            <td>
              <input type="text" id="lname" name="lname" maxlength="20" />(max
              20 char a-z and A-Z)
            </td>
          </tr>
          <tr>
            <td><label for="DOB" class="DOB">Date Of Birth</label></td>
            <td><input type="date" name="DOB" id="DOB" /></td>
          </tr>
          <tr>
            <td><label for="gender" class="gender">GENDER</label></td>
            <td><input type="radio" name="gender" id="gender" />male</td>
            <td><input type="radio" name="gender" id="gender" />female</td>
          </tr>
          <tr>
            <td><label for="email" name="email">EMAIL ID</label></td>
            <td><input type="email" name="email" id="email" /></td>
          </tr>
          <tr>
            <td><label for="phn" name="phn">MOBILE NO</label></td>
            <td><input type="tel" name="phn" id="phn" /></td>
          </tr>
          <tr>
            <td><label for="address">Adress</label></td>
            <td><textarea name="address" id="address"></textarea></td>
          </tr>
          <tr>
            <td><label for="city">CITY</label></td>
            <td><input type="text" name="city" id="city" /></td>
          </tr>
          <tr>
            <td><label for="pincode">PINCODE</label></td>
            <td>
              <input
                type="number"
                name="pincode"
                id="pincode"
                maxlength="6"
              />(6 digit number)
            </td>
          </tr>
          <tr>
            <td><label for="email" name="email">EMAIL ID</label></td>
            <td><input type="email" name="email" id="email" /></td>
          </tr>
          <tr>
            <td><label for="state" name="state">State</label></td>
            <td><input type="text" name="state" id="state" /></td>
          </tr>
          <tr>
            <td><label for="country" name="country">Country</label></td>
            <td><input type="text" name="state" id="state" /></td>
          </tr>
          <tr>
            <td><label for="hobbies" class="hobbies">HOBBIES</label></td>
            <td>
              <input type="checkbox" name="drawing" id="drawing" />Drawing<input
                type="checkbox"
                name="singing"
                id="singing"
              />Singing
              <input type="checkbox" name="dancing" id="dancing" />Dancing
              <br />
              <input type="checkbox" name="other" id="other" />Other
              <input type="text" name="other" id="other" />
            </td>
            <td></td>
          </tr>
          <tr>
            <td>Qualification</td>
            <td colspan="3">
              <table>
                <tr>
                  <th>Sl.No</th>
                  <th>Examination</th>
                  <th>Board</th>
                  <th>Percentage</th>
                  <th>Year of Pass</th>
                </tr>

                <tr>
                  <td>01</td>
                  <td><input type="text" name="exam1" /></td>
                  <td><input type="text" name="board1" /></td>
                  <td><input type="number" name="percentage1" /></td>
                  <td><input type="number" name="year1" /></td>
                </tr>

                <tr>
                  <td>02</td>
                  <td><input type="text" name="exam2" /></td>
                  <td><input type="text" name="board2" /></td>
                  <td><input type="number" name="percentage2" /></td>
                  <td><input type="number" name="year2" /></td>
                </tr>

                <tr>
                  <td>03</td>
                  <td><input type="text" name="exam3" /></td>
                  <td><input type="text" name="board3" /></td>
                  <td><input type="number" name="percentage3" /></td>
                  <td><input type="number" name="year3" /></td>
                </tr>

                <tr>
                  <td>04</td>
                  <td><input type="text" name="exam4" /></td>
                  <td><input type="text" name="board4" /></td>
                  <td><input type="number" name="percentage4" /></td>
                  <td><input type="number" name="year4" /></td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td>Courses Applied For</td>
            <td colspan="3">
              <input type="checkbox" name="course[]" value="BCA" /> BCA
              <input type="checkbox" name="course[]" value="B.Com" /> B.Com
              <input type="checkbox" name="course[]" value="B.Sc" /> B.Sc
              <input type="checkbox" name="course[]" value="B.A" /> B.A
            </td>
          </tr>

          <tr>
            <td colspan="4" align="center">
              <input type="submit" value="Submit" />
              <input type="reset" value="Reset" />
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
</body>
</html>
